# Services du développement : base, stockage et faux serveur de mails, sans l'application.
#   docker compose -f compose.dev.yaml up -d   puis   npm run dev   (http://localhost:3000)
# Mêmes variables que compose.yaml, lues dans .env (npm run setup). Mails reçus : http://localhost:8025
name: campuss-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: campus
      POSTGRES_DB: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env (npm run setup)}
    ports: ["127.0.0.1:${DEV_DB_PORT:-5432}:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio@sha256:0a01100085e30fb08d2f39e39c9f5c9d83a95707f220b007d813b690cd41622d
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER manquant dans .env (npm run setup)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD manquant dans .env (npm run setup)}
      MINIO_BROWSER: "off"
      MINIO_UPDATE: "off"
    ports: ["127.0.0.1:${DEV_S3_PORT:-9000}:9000"]
    volumes: [minio:/data]

  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:8419d1a4518c12889cf59f11043cb2318175841eb727c415e0aacbd0a749846f
    restart: "no"
    entrypoint: ["sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_APP_SECRET: ${S3_APP_SECRET}
    volumes: ["./deploy/minio-init.sh:/init.sh:ro"]
    depends_on:
      minio: { condition: service_started }

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${DEV_MAIL_UI_PORT:-8025}:8025"
      - "127.0.0.1:${DEV_SMTP_PORT:-1025}:1025"

volumes:
  postgres:
  minio:
